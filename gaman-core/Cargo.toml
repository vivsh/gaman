[package]
name = "gaman-core"
version = "0.3.22"
edition = "2024"
description = "Offline core engine for Gaman migrations"
license = "MIT"
repository = "https://github.com/vivsh/gaman"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10"
sqlparser = "0.62.0"
thiserror = "2.0.18"

[dev-dependencies]
proptest = "1"
