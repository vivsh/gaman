description: migrate target rollback removes later migration effects and records
features:
  - live_migration_application
  - rollback_migrations
  - migration_tracking
  - tables_columns
  - data_preservation

migrations:
  - id: 0001_create_users
    operations:
      - type: create_table
        table:
          name: users
          columns:
            - name: id
              type: integer
              primary_key: true
            - name: name
              type: text
  - id: 0002_add_email
    dependencies: [0001_create_users]
    operations:
      - type: add_column
        table_name: users
        column:
          name: email
          type: text
          nullable: true

dialects:
  postgres:
    checks: [rollback, migration_records, inspect, data]
    target: 0001_create_users
    expect_records: [0001_create_users]
    expect_schema:
      tables:
        users:
          name: users
          primary_key:
            name: users_pkey
            columns: [id]
          columns:
            - name: id
              type: integer
              primary_key: true
            - name: name
              type: text
    data:
      - sql: "SELECT email FROM users"
        expect_error: "does not exist"
  sqlite:
    checks: [rollback, migration_records, inspect, data]
    target: 0001_create_users
    expect_records: [0001_create_users]
    expect_schema:
      tables:
        users:
          name: users
          primary_key:
            name: users_pkey
            columns: [id]
          columns:
            - name: id
              type: integer
              primary_key: true
            - name: name
              type: text
    data:
      - sql: "SELECT email FROM users"
        expect_error: "no such column"
