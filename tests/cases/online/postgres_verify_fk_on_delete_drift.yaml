description: PostgreSQL verify reports foreign key on_delete drift
features:
  - live_inspect_verify
  - ownership_scoped_verify
  - single_foreign_keys

migrations:
  - id: 0001_create_users_preferences
    operations:
      - type: create_table
        table:
          name: users
          columns:
            - name: id
              type: serial
              primary_key: true
      - type: create_table
        table:
          name: preferences
          columns:
            - name: id
              type: serial
              primary_key: true
            - name: user_id
              type: integer
          foreign_keys:
            - name: preferences_user_id_fkey
              columns: [user_id]
              to_table: users
              to_columns: [id]
              on_delete: cascade

dialects:
  postgres:
    checks: [verify]
    mutate_sql: |
      ALTER TABLE preferences DROP CONSTRAINT preferences_user_id_fkey;
      ALTER TABLE preferences ADD CONSTRAINT preferences_user_id_fkey
        FOREIGN KEY (user_id) REFERENCES users(id);
    expect_verification:
      findings:
      - {operation: drop_add_foreign_key, entity_kind: foreign_key, entity_name: preferences.preferences_user_id_fkey, property: on_delete, expected: cascade, observed: "<none>", note: null}
      operations:
        - type: drop_foreign_key
          table_name: preferences
          foreign_key:
            name: preferences_user_id_fkey
            columns: [user_id]
            to_table: users
            to_columns: [id]
        - type: add_foreign_key
          table_name: preferences
          foreign_key:
            name: preferences_user_id_fkey
            columns: [user_id]
            to_table: users
            to_columns: [id]
            on_delete: cascade
