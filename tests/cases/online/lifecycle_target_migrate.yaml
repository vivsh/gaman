description: target migrate applies only migrations through the requested target
features:
  - live_migration_application
  - target_migrations
  - migration_tracking
  - tables_columns

migrations:
  - id: 0001_create_users
    operations:
      - type: create_table
        table:
          name: users
          columns:
            - name: id
              type: integer
              primary_key: true
  - id: 0002_add_email
    dependencies: [0001_create_users]
    operations:
      - type: add_column
        table_name: users
        column:
          name: email
          type: text
          nullable: true
  - id: 0003_create_audit
    dependencies: [0002_add_email]
    operations:
      - type: create_table
        table:
          name: audit_log
          columns:
            - name: user_id
              type: integer

dialects:
  postgres:
    checks: [migrate_to, migration_records, data]
    target: 0002_add_email
    expect_records: [0001_create_users, 0002_add_email]
    data:
      - sql: "SELECT CAST(COUNT(*) AS TEXT) FROM users"
        expect: ["0"]
      - sql: "SELECT CAST(COUNT(*) AS TEXT) FROM audit_log"
        expect_error: "does not exist"
  sqlite:
    checks: [migrate_to, migration_records, data]
    target: 0002_add_email
    expect_records: [0001_create_users, 0002_add_email]
    data:
      - sql: "SELECT CAST(COUNT(*) AS TEXT) FROM users"
        expect: ["0"]
      - sql: "SELECT CAST(COUNT(*) AS TEXT) FROM audit_log"
        expect_error: "no such table"
