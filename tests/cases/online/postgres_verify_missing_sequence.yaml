description: PostgreSQL verify detects a missing owned opaque sequence and plans recreation
features: [live_inspect_verify, ownership_scoped_verify, opaque_presence_verify, sequences_opaque]

migrations:
  - id: 0001_create_event_ids
    operations:
      - type: create_sequence
        sequence:
          name: event_ids
          sql: CREATE SEQUENCE event_ids START WITH 100

mutate_sql: DROP SEQUENCE event_ids;

dialects:
  postgres:
    checks: [verify]
    expect_verification:
      findings:
        - {operation: create_sequence, entity_kind: sequence, entity_name: event_ids, property: presence, expected: present, observed: "<missing>", note: null}
      operations:
        - type: create_sequence
          sequence:
            name: event_ids
            sql: CREATE SEQUENCE event_ids START WITH 100
