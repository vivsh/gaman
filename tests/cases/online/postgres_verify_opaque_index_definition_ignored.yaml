description: PostgreSQL verify treats changed owned opaque index definitions as present.
features: [live_inspect_verify, ownership_scoped_verify, opaque_presence_verify, opaque_index_metadata]
migrations:
  - id: 0001_owned_opaque_index
    operations:
      - type: create_table
        table:
          name: users
          columns:
            - {name: id, type: integer, primary_key: true}
            - {name: email, type: text}
      - type: add_index
        table_name: users
        index:
          name: users_email_opaque_idx
          columns: []
          opaque:
            raw: CREATE INDEX users_email_opaque_idx ON users ((lower(email)))
            trusted: true
mutate_sql: |
  DROP INDEX users_email_opaque_idx;
  CREATE INDEX users_email_opaque_idx ON users (email varchar_pattern_ops);
dialects:
  postgres:
    checks: [verify]
    expect_verification:
      findings: []
      operations: []
