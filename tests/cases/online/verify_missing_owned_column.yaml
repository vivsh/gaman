description: verify reports a missing owned column
features:
  - live_inspect_verify
  - ownership_scoped_verify
  - tables_columns

migrations:
  - id: 0001_create_users
    operations:
      - type: create_table
        table:
          name: users
          columns:
            - name: id
              type: integer
              primary_key: true
            - name: email
              type: text
              nullable: true

mutate_sql: |
  ALTER TABLE users DROP COLUMN email;

dialects:
  postgres:
    checks: [verify]
    expect_verify:
      - type: add_column
        table_name: users
        column:
          name: email
          type: text
          nullable: true
  sqlite:
    checks: [verify]
    expect_verify:
      - type: add_column
        table_name: users
        column:
          name: email
          type: text
          nullable: true
