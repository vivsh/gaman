            check: confidence >= 0 AND confidence <= 1
    - id: 0002_drop_confidence_check
      atomic: false
      dependencies: [0001_create_results]
      operations:
      - type: drop_constraint
        table_name: results
        constraint:
          kind: check
          name: results_confidence_check
          expression: confidence >= 0 AND confidence <= 1
    expect_verification:
      findings: []
      operations: []
    data:
    - sql: INSERT INTO results (id, confidence) VALUES (1, 1.5)
  mariadb:
    checks: [migrate, verify, data]
    migrations:
