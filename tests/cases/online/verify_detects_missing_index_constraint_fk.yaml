description: verify reports missing owned indexes constraints and foreign keys
features:
  - live_inspect_verify
  - ownership_scoped_verify
  - indexes_constraints
  - indexes
  - check_constraints
  - single_foreign_keys

migrations:
  - id: 0001_create_accounts
    operations:
      - type: create_table
        table:
          name: accounts
          columns:
            - name: id
              type: integer
              primary_key: true
            - name: parent_id
              type: integer
              nullable: true
            - name: email
              type: text
            - name: age
              type: integer
          foreign_keys:
            - name: accounts_parent_fkey
              columns: [parent_id]
              to_table: accounts
              to_columns: [id]
          indexes:
            - name: accounts_email_idx
              columns: [email]
          constraints:
            - kind: check
              name: accounts_age_check
              expression: age >= 0

mutate_sql: |
  DROP INDEX accounts_email_idx;
  ALTER TABLE accounts DROP CONSTRAINT accounts_parent_fkey;
  ALTER TABLE accounts DROP CONSTRAINT accounts_age_check;

dialects:
  postgres:
    checks: [verify]
    expect_verification:
      findings:
      - {operation: add_foreign_key, entity_kind: foreign_key, entity_name: accounts.accounts_parent_fkey, property: presence, expected: present, observed: "<missing>", note: null}
      - {operation: add_index, entity_kind: index, entity_name: accounts.accounts_email_idx, property: presence, expected: present, observed: "<missing>", note: null}
      - {operation: add_constraint, entity_kind: constraint, entity_name: accounts.accounts_age_check, property: presence, expected: present, observed: "<missing>", note: null}
      operations:
        - type: add_foreign_key
          table_name: accounts
          foreign_key:
            name: accounts_parent_fkey
            columns: [parent_id]
            to_table: accounts
            to_columns: [id]
        - type: add_index
          table_name: accounts
          index:
            name: accounts_email_idx
            columns: [email]
        - type: add_constraint
          table_name: accounts
          constraint:
            kind: check
            name: accounts_age_check
            expression: age >= 0
