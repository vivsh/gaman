description: SQLite rebuild changes default and nullability while preserving rows
features:
  - live_migration_application
  - sqlite_rebuild_planner
  - type_null_default_changes
  - data_preservation

migrations:
  - id: 0001_create_tasks
    operations:
      - type: create_table
        table:
          name: tasks
          columns:
            - name: id
              type: integer
              primary_key: true
            - name: status
              type: text
              nullable: true
      - type: statement
        up: "INSERT INTO tasks (id, status) VALUES (1, NULL)"
  - id: 0002_require_status
    dependencies: [0001_create_tasks]
    operations:
      - type: alter_column
        table_name: tasks
        old:
          name: status
          type: text
          nullable: true
        new:
          name: status
          type: text
          nullable: false
          default: "'todo'"

dialects:
  sqlite:
    checks: [migrate, data]
    data:
      - sql: "SELECT status FROM tasks ORDER BY id"
        expect: ["todo"]
