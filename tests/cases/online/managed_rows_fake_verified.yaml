description: verified fake application adopts matching existing managed rows and records the migration
features:
  - managed_rows
  - live_inspect_verify
  - migration_tracking
  - data_preservation

migrations:
  - id: 0001_create_items
    atomic: false
    operations:
      - type: create_table
        table:
          name: items
          columns:
            - name: id
              type: varchar(64)
              primary_key: true
            - name: name
              type: varchar(128)
            - name: external_note
              type: varchar(128)
              nullable: true
  - id: 0002_adopt_managed
    dependencies: [0001_create_items]
    operations:
      - type: insert_row
        table_name: items
        key: [id]
        row: {id: managed, name: existing}

mutate_sql: |
  INSERT INTO items (id, name, external_note) VALUES ('managed', 'existing', 'external-value');

dialects:
  postgres: &adopt
    checks: [migrate_to, fake_verified, migration_records, data]
    target: 0001_create_items
    fake_verified_target: 0002_adopt_managed
    expect_records: [0001_create_items, 0002_adopt_managed]
    data:
      - sql: "SELECT name FROM items WHERE id = 'managed'"
        expect: [existing]
      - sql: "SELECT external_note FROM items WHERE id = 'managed'"
        expect: [external-value]
  sqlite: *adopt
  mysql: *adopt
  mariadb: *adopt
