description: PostgreSQL view replacement updates the inspected view definition
features:
  - live_migration_application
  - live_inspect_verify
  - views_opaque

migrations:
  - id: 0001_create_view
    operations:
      - type: create_table
        table:
          name: users
          columns:
            - name: id
              type: integer
              primary_key: true
            - name: active
              type: boolean
              default: "true"
      - type: create_view
        view:
          name: visible_users
          definition: "SELECT id FROM users"
      - type: statement
        up: "INSERT INTO users (id) VALUES (1)"
        down: "DELETE FROM users WHERE id = 1"
  - id: 0002_replace_view
    dependencies: [0001_create_view]
    operations:
      - type: replace_view
        old:
          name: visible_users
          definition: "SELECT id FROM users"
        new:
          name: visible_users
          definition: "SELECT 0 AS id WHERE false"

dialects:
  postgres:
    checks: [migrate, inspect, data]
    data:
      - sql: "SELECT id::text FROM visible_users"
        expect: []
    expect_schema:
      tables:
        users:
          name: users
          primary_key:
            name: users_pkey
            columns: [id]
          columns:
            - name: id
              type: integer
              primary_key: true
            - name: active
              type: boolean
              default: "true"
      views:
        visible_users:
          name: visible_users
          definition: "SELECT 0 AS id\n  WHERE false;"
