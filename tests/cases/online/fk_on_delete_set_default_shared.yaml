description: PostgreSQL and SQLite enforce ON DELETE SET DEFAULT with a valid parent default.
features: [live_migration_application, foreign_key_actions, single_foreign_keys, data_preservation]
migrations:
  - id: 0001_fk_set_default
    operations:
      - type: create_table
        table:
          name: parents
          columns: [{name: id, type: integer, primary_key: true}]
      - type: create_table
        table:
          name: children
          columns:
            - {name: id, type: integer, primary_key: true}
            - {name: parent_id, type: integer, default: '0'}
          foreign_keys:
            - name: children_parent_id_fkey
              columns: [parent_id]
              to_table: parents
              to_columns: [id]
              on_delete: set_default
      - {type: statement, up: 'INSERT INTO parents (id) VALUES (0), (1)'}
      - {type: statement, up: 'INSERT INTO children (id, parent_id) VALUES (10, 1)'}
mutate_sql: DELETE FROM parents WHERE id = 1
dialects:
  postgres:
    checks: [migrate, verify, data]
    expect_verify: []
    data:
      - sql: SELECT CAST(parent_id AS text) FROM children WHERE id = 10
        expect: ['0']
  sqlite:
    checks: [migrate, verify, data]
    expect_verify: []
    data:
      - sql: SELECT CAST(parent_id AS text) FROM children WHERE id = 10
        expect: ['0']
