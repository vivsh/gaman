description: verify ignores a live-only column on an owned table
features:
  - live_inspect_verify
  - ownership_scoped_verify
  - tables_columns

migrations:
  - id: 0001_create_users
    operations:
      - type: create_table
        table:
          name: users
          columns:
            - name: id
              type: integer
              primary_key: true

mutate_sql: |
  ALTER TABLE users ADD COLUMN external_note text;

dialects:
  postgres:
    checks: [verify]
    expect_verification:
      findings: []
      operations: []
  sqlite:
    checks: [verify]
    expect_verification:
      findings: []
      operations: []
