description: PostgreSQL applies an opaque sequence before a table default and ignores counter state during verify
features:
  - live_migration_application
  - live_inspect_verify
  - sequences_opaque
  - data_preservation

migrations:
  - id: 0001_create_sequence
    operations:
      - type: create_sequence
        sequence:
          name: event_ids
          sql: CREATE SEQUENCE event_ids START WITH 100 INCREMENT BY 5
      - type: create_table
        table:
          name: events
          columns:
            - name: id
              type: bigint
              primary_key: true
              default: "nextval('event_ids'::regclass)"

mutate_sql: SELECT setval('event_ids', 900, true);

dialects:
  postgres:
    checks: [migrate, verify, data]
    expect_verification:
      findings: []
      operations: []
    data:
      - sql: "INSERT INTO events DEFAULT VALUES RETURNING id::text"
        expect: ["905"]
      - sql: "SELECT nextval('event_ids')::text"
        expect: ["910"]
