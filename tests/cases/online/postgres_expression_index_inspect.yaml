description: PostgreSQL inspect preserves expression index metadata without failing
features:
  - live_inspect_verify
  - indexes
  - opaque_index_metadata

setup_sql: |
  CREATE TABLE users (
      id integer PRIMARY KEY,
      email text NOT NULL
  );
  CREATE INDEX users_lower_email_idx ON users ((lower(email)));

dialects:
  postgres:
    checks: [inspect]
    expect_schema:
      tables:
        users:
          name: users
          primary_key:
            name: users_pkey
            columns: [id]
          columns:
            - name: id
              type: integer
              primary_key: true
            - name: email
              type: text
          indexes:
            - name: users_lower_email_idx
              columns: []
              opaque:
                raw: CREATE INDEX users_lower_email_idx ON users USING btree (lower(email))
                trusted: true
                fingerprint: v1:sha256:b528fc6ac317c3640410937f3e9943746562c7ba57f8209f5c646e327f7c5735
