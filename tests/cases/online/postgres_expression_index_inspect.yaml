description: PostgreSQL inspect rejects opaque expression indexes from authored YAML export
features:
  - live_inspect_verify
  - indexes
  - opaque_index_metadata

setup_sql: |
  CREATE TABLE users (
      id integer PRIMARY KEY,
      email text NOT NULL
  );
  CREATE INDEX users_lower_email_idx ON users ((lower(email)));

dialects:
  postgres:
    checks: [inspect, error]
    expect_error: opaque owned entity
