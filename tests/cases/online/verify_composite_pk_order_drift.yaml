description: verify reports composite primary key order drift as manual drift
features:
  - live_inspect_verify
  - ownership_scoped_verify
  - composite_primary_keys
  - unsupported_feature_errors

migrations:
  - id: 0001_create_memberships
    operations:
      - type: create_table
        table:
          name: memberships
          primary_key:
            columns: [tenant_id, user_id]
          columns:
            - name: tenant_id
              type: integer
            - name: user_id
              type: integer
            - name: role
              type: text

dialects:
  postgres:
    checks: [verify]
    mutate_sql: |
      ALTER TABLE memberships DROP CONSTRAINT memberships_pkey;
      ALTER TABLE memberships ADD CONSTRAINT memberships_pkey PRIMARY KEY (user_id, tenant_id);
    expect_verification:
      findings:
      - {operation: alter_primary_key, entity_kind: constraint, entity_name: memberships.memberships_pkey, property: columns, expected: "[tenant_id, user_id]", observed: "[user_id, tenant_id]", note: null}
      operations: []
  sqlite:
    checks: [verify]
    mutate_sql: |
      CREATE TABLE memberships_rebuild (
        tenant_id integer NOT NULL,
        user_id integer NOT NULL,
        role text NOT NULL,
        CONSTRAINT memberships_pkey PRIMARY KEY (user_id, tenant_id)
      );
      INSERT INTO memberships_rebuild (tenant_id, user_id, role)
        SELECT tenant_id, user_id, role FROM memberships;
      DROP TABLE memberships;
      ALTER TABLE memberships_rebuild RENAME TO memberships;
    expect_verification:
      findings:
      - {operation: alter_primary_key, entity_kind: constraint, entity_name: memberships.memberships_pkey, property: columns, expected: "[tenant_id, user_id]", observed: "[user_id, tenant_id]", note: null}
      operations: []
