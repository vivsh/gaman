description: PostgreSQL repair applies a text-to-jsonb cast to valid JSON data
features:
  - live_migration_application
  - live_inspect_verify
  - type_null_default_changes
  - data_preservation

migrations:
  - id: 0001_crawler_source
    operations:
      - type: create_table
        table:
          name: crawler_source
          columns:
            - name: id
              type: integer
              primary_key: true
            - name: health_fault
              type: jsonb
              nullable: true

mutate_sql: |
  INSERT INTO crawler_source (id, health_fault) VALUES (1, '{"reason":"timeout"}');
  ALTER TABLE crawler_source ALTER COLUMN health_fault TYPE text USING health_fault::text;

dialects:
  postgres:
    checks: [repair, data]
    repair_apply: true
    expect_repair_operations:
      - type: alter_column
        table_name: crawler_source
        old: {name: health_fault, type: text, nullable: true}
        new: {name: health_fault, type: jsonb, nullable: true}
        cast_expr: '"health_fault"::jsonb'
    data:
      - sql: "SELECT pg_typeof(health_fault)::text FROM crawler_source WHERE id = 1"
        expect: [jsonb]
      - sql: "SELECT health_fault->>'reason' FROM crawler_source WHERE id = 1"
        expect: [timeout]
