description: SQLite rebuild drops foreign key unique and check constraints
features:
  - live_migration_application
  - sqlite_rebuild_planner
  - indexes_constraints
  - composite_foreign_keys
  - data_preservation

migrations:
  - id: 0001_create_tables
    operations:
      - type: create_table
        table:
          name: parents
          columns:
            - name: id
              type: integer
              primary_key: true
      - type: create_table
        table:
          name: children
          columns:
            - name: id
              type: integer
              primary_key: true
            - name: parent_id
              type: integer
            - name: code
              type: text
            - name: qty
              type: integer
          foreign_keys:
            - name: children_parent_fkey
              columns: [parent_id]
              to_table: parents
              to_columns: [id]
          constraints:
            - kind: unique
              name: children_code_key
              columns: [code]
            - kind: check
              name: children_qty_check
              expression: qty >= 0
  - id: 0002_drop_rules
    dependencies: [0001_create_tables]
    operations:
      - type: drop_foreign_key
        table_name: children
        foreign_key:
          name: children_parent_fkey
          columns: [parent_id]
          to_table: parents
          to_columns: [id]
      - type: drop_constraint
        table_name: children
        constraint:
          kind: unique
          name: children_code_key
          columns: [code]
      - type: drop_constraint
        table_name: children
        constraint:
          kind: check
          name: children_qty_check
          expression: qty >= 0

dialects:
  sqlite:
    checks: [migrate, data]
    data:
      - sql: "INSERT INTO children (id, parent_id, code, qty) VALUES (1, 999, 'dup', -1)"
      - sql: "INSERT INTO children (id, parent_id, code, qty) VALUES (2, 999, 'dup', -2)"
      - sql: "SELECT CAST(COUNT(*) AS TEXT) FROM children"
        expect: ["2"]
