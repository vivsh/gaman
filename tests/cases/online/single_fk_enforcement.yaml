description: single-column foreign keys are enforced by live databases
features:
  - live_migration_application
  - single_primary_keys
  - single_foreign_keys
  - data_preservation

migrations:
  - id: 0001_create_users
    operations:
      - type: create_table
        table:
          name: users
          columns:
            - name: id
              type: integer
              primary_key: true
  - id: 0002_create_posts
    dependencies: [0001_create_users]
    operations:
      - type: create_table
        table:
          name: posts
          columns:
            - name: id
              type: integer
              primary_key: true
            - name: user_id
              type: integer
          foreign_keys:
            - columns: [user_id]
              to_table: users
              to_columns: [id]

dialects:
  postgres:
    checks: [migrate, data]
    data:
      - sql: "INSERT INTO users (id) VALUES (1)"
      - sql: "INSERT INTO posts (id, user_id) VALUES (1, 1)"
      - sql: "INSERT INTO posts (id, user_id) VALUES (2, 99)"
        expect_error: foreign key
  sqlite:
    checks: [migrate, data]
    data:
      - sql: "INSERT INTO users (id) VALUES (1)"
      - sql: "INSERT INTO posts (id, user_id) VALUES (1, 1)"
      - sql: "INSERT INTO posts (id, user_id) VALUES (2, 99)"
        expect_error: FOREIGN KEY constraint failed
