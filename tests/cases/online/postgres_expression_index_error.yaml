description: PostgreSQL inspect fails clearly for expression indexes until they are modeled
features:
  - unsupported_feature_errors

setup_sql: |
  CREATE TABLE users (
      id integer PRIMARY KEY,
      email text NOT NULL
  );
  CREATE INDEX users_lower_email_idx ON users ((lower(email)));

dialects:
  postgres:
    checks: [inspect, error]
    expect_error: expression index
