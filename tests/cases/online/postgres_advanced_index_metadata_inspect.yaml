description: PostgreSQL inspect rejects advanced opaque indexes from authored YAML export
features:
  - live_inspect_verify
  - indexes
  - opaque_index_metadata

setup_sql: |
  CREATE TABLE users (
      id integer PRIMARY KEY,
      email varchar(255) NOT NULL,
      created_at timestamptz NOT NULL,
      body tsvector NOT NULL
  );
  CREATE INDEX users_email_like_idx ON users (email varchar_pattern_ops);
  CREATE INDEX users_created_at_sort_idx ON users (created_at DESC NULLS LAST);
  CREATE INDEX users_email_collate_idx ON users (email COLLATE "C");
  CREATE INDEX users_body_gin_idx ON users USING gin (body);

dialects:
  postgres:
    checks: [inspect, error]
    expect_error: opaque owned entity
