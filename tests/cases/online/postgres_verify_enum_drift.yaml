description: PostgreSQL verify reports owned enum label order drift
features:
  - live_inspect_verify
  - ownership_scoped_verify
  - enums

migrations:
  - id: 0001_create_status
    operations:
      - type: create_enum
        enum_def:
          name: ticket_status
          values: [open, pending, closed]

mutate_sql: |
  DROP TYPE ticket_status;
  CREATE TYPE ticket_status AS ENUM ('open', 'closed', 'pending');

dialects:
  postgres:
    checks: [verify]
    expect_verification:
      findings:
      - {operation: alter_enum, entity_kind: enum, entity_name: ticket_status, property: values, expected: "[open, pending, closed]", observed: "[open, closed, pending]", note: null}
      operations:
        - type: drop_enum
          enum_def:
            name: ticket_status
            values: [open, closed, pending]
        - type: create_enum
          enum_def:
            name: ticket_status
            values: [open, pending, closed]
