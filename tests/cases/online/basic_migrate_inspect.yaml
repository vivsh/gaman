description: migrate a simple users table and inspect the resulting schema
features:
  - live_migration_application
  - live_inspect_verify
  - tables_columns
  - table_create_drop_rename
  - column_add_drop_rename
  - single_primary_keys

migrations:
  - id: 0001_create_users
    operations:
      - type: create_table
        table:
          name: users
          columns:
            - name: id
              type: integer
              primary_key: true
            - name: username
              type: text
  - id: 0002_add_email
    dependencies: [0001_create_users]
    operations:
      - type: add_column
        table_name: users
        column:
          name: email
          type: text
          nullable: true

dialects:
  postgres:
    checks: [migrate, inspect]
    expect_schema:
      tables:
        users:
          name: users
          primary_key:
            name: users_pkey
            columns: [id]
          columns:
            - name: id
              type: integer
              primary_key: true
            - name: username
              type: text
            - name: email
              type: text
              nullable: true
  sqlite:
    checks: [migrate, inspect]
    expect_schema:
      tables:
        users:
          name: users
          primary_key:
            name: users_pkey
            columns: [id]
          columns:
            - name: id
              type: INTEGER
              primary_key: true
            - name: username
              type: TEXT
            - name: email
              type: TEXT
              nullable: true
