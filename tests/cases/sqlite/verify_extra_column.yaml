description: Verify reports drift when live SQLite schema has an extra column.
kind: verify
migrations:
  - id: 0001_create_users
    operations:
      - type: create_table
        table:
          name: users
          columns:
            - name: id
              type: integer
              primary_key: true
mutate_sql: |
  ALTER TABLE users ADD COLUMN rogue TEXT;
expect_verify:
  - type: drop_column
    table_name: users
    column:
      name: rogue
      type: text
      nullable: true
    cascade: false
