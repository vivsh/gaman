---
description: A rename decision with an invalid candidate fails deterministically.
group: clarifier
features:
- group.clarifier
- kind.schema_to_migration
kind: schema_to_migration
dialect: postgres
name: invalid_candidate
migrations:
- id: 0001_create_users
  operations:
  - type: create_table
    table:
      name: users
      columns:
      - name: username
        type: text
        nullable: true
decisions:
- clarification_id: rename_col:users:username
  answer:
    type: rename_to
    value: display_name
current:
  tables:
    users:
      name: users
      columns:
      - name: handle
        type: text
        nullable: true
expect_error: is not a valid candidate
