---
description: Unknown type emits a structured type clarification with deterministic
  suggestions.
group: clarifier
features:
- clarification.unknown_type
- group.clarifier
- kind.schema_to_migration
kind: schema_to_migration
dialect: postgres
name: add_items
current:
  tables:
    items:
      name: items
      columns:
      - name: id
        type: integer
        primary_key: true
      - name: value
        type: intger
        nullable: true
expect_clarifications:
- id: unknown_type:items:value
  severity: warning
  kind:
    type: unknown_type
    table: items
    column: value
    type_name: intger
    suggested:
    - integer
