---
description: RenameTo rewrites an enum label replacement into a rename-enum-value
  operation.
group: clarifier
features:
- answer.rename_to
- group.clarifier
- kind.schema_to_migration
- operation.rename_enum_value
kind: schema_to_migration
dialect: postgres
name: rename_status_label
migrations:
- id: 0001_create_status
  operations:
  - type: create_enum
    enum_def:
      name: status
      values:
      - active
      - inactive
decisions:
- clarification_id: rename_enum_value:status:inactive
  answer:
    type: rename_to
    value: disabled
current:
  tables: {}
  enums:
    status:
      name: status
      values:
      - active
      - disabled
expect_operations:
- type: create_enum
  enum_def:
    name: status
    values:
    - active
    - disabled
- type: rename_enum_value
  enum_name: status
  schema:
  old_value: inactive
  new_value: disabled
