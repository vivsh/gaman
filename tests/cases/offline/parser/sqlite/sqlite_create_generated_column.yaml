---
description: SQLite parser accepts generated columns.
group: parser
features:
- group.parser
- kind.parser
- parser.sqlite.parser_sqlite_create_generated_column
kind: parser
parser_dialect: sqlite
sql: |
  CREATE TABLE users (
      email text,
      email_norm text GENERATED ALWAYS AS (lower(email)) STORED
  );
expect_parse: ok
expect_lowering: ok
