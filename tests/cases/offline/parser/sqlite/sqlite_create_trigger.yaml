---
description: SQLite parser lowers trigger bodies onto their target table.
group: parser
features:
- group.parser
- kind.parser
- parser.sqlite.parser_sqlite_create_trigger
kind: parser
parser_dialect: sqlite
sql: |
  CREATE TABLE users (id integer, created_at text);
  CREATE TRIGGER users_ai
  AFTER INSERT ON users
  BEGIN
      UPDATE users SET created_at = CURRENT_TIMESTAMP WHERE id = NEW.id;
  END;
expect_parse: ok
expect_lowering: ok
