---
description: PostgreSQL event triggers are reported as parse errors.
group: parser
features:
- group.parser
- kind.parser
- parser.postgres.parser_postgres_create_event_trigger_parse_error
kind: parser
parser_dialect: postgres
sql: |
  CREATE EVENT TRIGGER ddl_audit
  ON ddl_command_end
  EXECUTE FUNCTION audit.log_ddl();
expect_parse: ok
expect_lowering: error
expect_error: EVENT
