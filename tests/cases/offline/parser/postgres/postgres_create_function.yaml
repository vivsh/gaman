---
description: PostgreSQL parser and Gaman lowering handle a simple SQL function.
group: parser
features:
- group.parser
- kind.parser
- operation.create_function
- parser.postgres.parser_postgres_create_function
kind: parser
parser_dialect: postgres
sql: |
  CREATE FUNCTION add_one(integer)
  RETURNS integer
  LANGUAGE sql
  IMMUTABLE
  AS $$ SELECT $1 + 1 $$;
expect_parse: ok
expect_lowering: ok
expect_schema:
  tables: {}
  functions:
    add_one(integer):
      name: add_one
      parameters:
      - name: ''
        type: integer
      returns: integer
      language: sql
      body: " SELECT $1 + 1 "
      volatility: immutable
