---
description: PostgreSQL parser lowers a function-backed CREATE TRIGGER onto its table.
group: parser
features:
- group.parser
- kind.parser
- parser.postgres.parser_postgres_create_trigger
kind: parser
parser_dialect: postgres
sql: |
  CREATE TABLE users (id bigint);
  CREATE TRIGGER users_audit_trg
  AFTER INSERT ON users
  FOR EACH ROW
  EXECUTE FUNCTION audit_users();
expect_parse: ok
expect_lowering: ok
