---
description: sqlparser parses PostgreSQL CREATE TRIGGER but Gaman lowering does not
  model standalone trigger DDL yet.
group: parser
features:
- group.parser
- kind.sql_parse
- parser.postgres.parser_postgres_create_trigger
kind: sql_parse
parser_dialect: postgres
sql: |
  CREATE TRIGGER users_audit_trg
  AFTER INSERT ON users
  FOR EACH ROW
  EXECUTE FUNCTION audit_users();
expect_parse: ok
expect_lowering: unsupported
expect_error: unsupported SQL statement
