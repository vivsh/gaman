---
description: PostgreSQL logical replication publications are reported as parse errors.
group: parser
features:
- group.parser
- kind.parser
- parser.postgres.parser_postgres_create_publication_parse_error
kind: parser
parser_dialect: postgres
sql: 'CREATE PUBLICATION app_pub FOR TABLE users, orders WITH (publish = ''insert,
  update, delete'');

'
expect_parse: error
expect_lowering: error
expect_error: PUBLICATION
