---
description: PostgreSQL parser lowers generated columns with their expression.
group: parser
features:
- group.parser
- kind.parser
- parser.postgres.parser_postgres_create_table_generated_column
kind: parser
parser_dialect: postgres
sql: |
  CREATE TABLE users (
      id integer PRIMARY KEY,
      email text NOT NULL,
      email_norm text GENERATED ALWAYS AS (lower(email)) STORED
  );
expect_parse: ok
expect_lowering: ok
expect_schema:
  tables:
    users:
      name: users
      columns:
      - name: id
        type: integer
        primary_key: true
      - name: email
        type: text
      - name: email_norm
        type: text
        nullable: true
        generated: lower(email)
