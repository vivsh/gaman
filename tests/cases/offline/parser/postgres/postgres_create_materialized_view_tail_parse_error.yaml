---
description: PostgreSQL materialized view WITH DATA syntax is reported as a parse error.
group: parser
features:
- group.parser
- kind.parser
- parser.postgres.parser_postgres_create_materialized_view_tail_parse_error
kind: parser
parser_dialect: postgres
sql: |
  CREATE MATERIALIZED VIEW active_users
  AS SELECT * FROM users WHERE deleted_at IS NULL
  WITH DATA;
expect_parse: ok
expect_lowering: error
expect_error: WITH
