---
description: PostgreSQL exclusion constraints are reported as parse errors.
group: parser
features:
- group.parser
- kind.parser
- parser.postgres.parser_postgres_create_table_exclude_parse_error
kind: parser
parser_dialect: postgres
sql: |
  CREATE TABLE room_reservations (
      room text,
      during tsrange,
      EXCLUDE USING gist (room WITH =, during WITH &&)
  );
expect_parse: error
expect_lowering: error
expect_error: Expected
