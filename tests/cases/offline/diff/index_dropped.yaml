---
description: Diff drops an index removed from the desired schema.
group: diff
features:
- diff.diff_index_dropped
- group.diff
- kind.schema_to_migration
- operation.drop_index
- renderer.postgres.create_table
- renderer.postgres.drop_index
kind: schema_to_migration
dialect: postgres
name: drop_email_index
migrations:
- id: 0001_create_users
  operations:
  - type: create_table
    table:
      name: users
      columns:
      - name: email
        type: text
      indexes:
      - name: users_email_idx
        columns:
        - email
current:
  tables:
    users:
      name: users
      columns:
      - name: email
        type: text
expect_operations:
- type: drop_index
  table_name: users
  index:
    name: users_email_idx
    columns:
    - email
expect_sql: 'DROP INDEX "users_email_idx"

'
