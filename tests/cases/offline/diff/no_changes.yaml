---
description: No migration is generated when the schema matches the current state.
group: diff
features:
- diff.schema_to_migration_no_changes
- group.diff
- kind.schema_to_migration
kind: schema_to_migration
dialect: postgres
name: no_changes
migrations:
- id: 0001_create_users
  operations:
  - type: create_table
    table:
      name: users
      columns:
      - name: id
        type: integer
        primary_key: true
      - name: username
        type: text
current:
  tables:
    users:
      name: users
      columns:
      - name: id
        type: integer
        primary_key: true
      - name: username
        type: text
expect_no_changes: true
