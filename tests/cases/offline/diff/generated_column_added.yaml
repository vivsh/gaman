---
description: Diff adds a generated column and renders the generated expression.
group: diff
features:
- diff.diff_generated_column_added
- group.diff
- kind.schema_to_migration
- renderer.postgres.add_column
- renderer.postgres.create_table
kind: schema_to_migration
dialect: postgres
name: add_generated_email
migrations:
- id: 0001_create_users
  operations:
  - type: create_table
    table:
      name: users
      columns:
      - name: email
        type: text
current:
  tables:
    users:
      name: users
      columns:
      - name: email
        type: text
      - name: email_norm
        type: text
        nullable: true
        generated: lower(email)
expect_operations:
- type: add_column
  table_name: users
  column:
    name: email_norm
    type: text
    nullable: true
    generated: lower(email)
expect_sql: 'ALTER TABLE "users" ADD COLUMN "email_norm" text GENERATED ALWAYS AS
  (lower(email)) STORED

'
