description: Accepted unmanaged table option changes record metadata without emitting SQL.
group: diff
features: [unmanaged_table_options, group.diff, kind.sql_schema_to_migration]
kind: sql_schema_to_migration
dialect: postgres
name: acknowledge_table_storage
migrations:
- id: 0001_events
  operations:
  - type: create_table
    table:
      name: events
      columns: [{name: id, type: integer, primary_key: true}]
      options:
        header_raw: [UNLOGGED]
        trusted: true
sql: CREATE TABLE events (id integer PRIMARY KEY) WITH (fillfactor = 80);
decisions:
- clarification_id: unmanaged_table_options:events
  answer: {type: accept_risk}
expect_sql: ''
