---
description: Replay a three-migration chain into the expected schema.
group: replay
features:
- group.replay
- kind.migration_to_replay
- replay.migration_to_replay_chain
kind: migration_to_replay
dialect: postgres
migrations:
- id: 0001_create_users
  operations:
  - type: create_table
    table:
      name: users
      columns:
      - name: id
        type: integer
        primary_key: true
      - name: username
        type: text
- id: 0002_add_email
  dependencies:
  - 0001_create_users
  operations:
  - type: add_column
    table_name: users
    column:
      name: email
      type: text
      nullable: true
- id: 0003_create_posts
  dependencies:
  - 0002_add_email
  operations:
  - type: create_table
    table:
      name: posts
      columns:
      - name: id
        type: integer
        primary_key: true
      - name: title
        type: text
      - name: user_id
        type: integer
      foreign_keys:
      - name: posts_user_id_fk
        from_column: user_id
        to_table: users
        to_column: id
      indexes:
      - name: posts_user_id_idx
        columns:
        - user_id
expect_schema:
  tables:
    posts:
      name: posts
      columns:
      - name: id
        type: integer
        primary_key: true
      - name: title
        type: text
      - name: user_id
        type: integer
      foreign_keys:
      - name: posts_user_id_fk
        from_column: user_id
        to_table: users
        to_column: id
      indexes:
      - name: posts_user_id_idx
        columns:
        - user_id
    users:
      name: users
      columns:
      - name: id
        type: integer
        primary_key: true
      - name: username
        type: text
      - name: email
        type: text
        nullable: true
