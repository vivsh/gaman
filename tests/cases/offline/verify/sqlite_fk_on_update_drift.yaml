description: SQLite semantic drift reports the expected and observed on_update actions.
group: verify
features: [foreign_key_actions]
kind: verify
dialect: sqlite
replayed:
  tables:
    parents:
      columns: [{name: id, type: integer, primary_key: true}]
    children:
      columns: [{name: parent_id, type: integer}]
      foreign_keys:
      - name: children_parent_id_fkey
        columns: [parent_id]
        to_table: parents
        to_columns: [id]
        on_update: cascade
inspected:
  tables:
    parents:
      columns: [{name: id, type: integer, primary_key: true}]
    children:
      columns: [{name: parent_id, type: integer}]
      foreign_keys:
      - name: children_parent_id_fkey
        columns: [parent_id]
        to_table: parents
        to_columns: [id]
        on_update: restrict
expect_findings:
- operation: drop_add_foreign_key
  entity_kind: foreign_key
  entity_name: children.children_parent_id_fkey
  property: on_update
  expected: cascade
  observed: restrict
expect_report:
- '  drift: drop_add_foreign_key children.children_parent_id_fkey'
- '    on_update: expected cascade, observed restrict'
