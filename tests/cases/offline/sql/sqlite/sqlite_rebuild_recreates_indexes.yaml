---
description: SQLite rebuild recreates target indexes after renaming the rebuilt table.
group: sql_rendering
features:
- group.sql_rendering
- kind.migration_to_sql
- renderer.sqlite.create_table
- renderer.sqlite.drop_column
- sql_rendering.sql_sqlite_rebuild_recreates_indexes
kind: migration_to_sql
dialect: sqlite
migrations:
- id: 0001_create_users
  operations:
  - type: create_table
    table:
      name: users
      columns:
      - name: id
        type: integer
        primary_key: true
      - name: email
        type: text
        nullable: true
      - name: legacy
        type: text
        nullable: true
      indexes:
      - name: users_email_idx
        columns:
        - email
- id: 0002_drop_legacy
  dependencies:
  - 0001_create_users
  operations:
  - type: drop_column
    table_name: users
    column:
      name: legacy
      type: text
      nullable: true
expect_sql: |
  CREATE TABLE "users" ("id" integer PRIMARY KEY, "email" text, "legacy" text)
  CREATE INDEX "users_email_idx" ON "users" ("email")
  PRAGMA defer_foreign_keys = ON
  CREATE TABLE "__gaman_rebuild_users" ("id" integer PRIMARY KEY, "email" text)
  INSERT INTO "__gaman_rebuild_users" ("id", "email") SELECT "id", "email" FROM "users"
  DROP TABLE "users"
  ALTER TABLE "__gaman_rebuild_users" RENAME TO "users"
  CREATE INDEX "users_email_idx" ON "users" ("email")
  DROP TABLE IF EXISTS temp."__gaman_fk_check_users"
  CREATE TEMP TABLE "__gaman_fk_check_users" ("violation" integer CHECK ("violation" = 0))
  INSERT INTO temp."__gaman_fk_check_users" ("violation") SELECT 1 FROM pragma_foreign_key_check
  DROP TABLE temp."__gaman_fk_check_users"
  PRAGMA foreign_key_check
