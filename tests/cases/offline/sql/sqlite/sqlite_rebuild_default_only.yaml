---
description: SQLite rebuild preserves existing values when only a column default changes.
group: sql_rendering
features:
- group.sql_rendering
- kind.migration_to_sql
- renderer.sqlite.alter_column
- renderer.sqlite.create_table
- sql_rendering.sql_sqlite_rebuild_default_only
kind: migration_to_sql
dialect: sqlite
migrations:
- id: 0001_create_users
  operations:
  - type: create_table
    table:
      name: users
      columns:
      - name: status
        type: text
        nullable: true
        default: "'pending'"
- id: 0002_change_default
  dependencies:
  - 0001_create_users
  operations:
  - type: alter_column
    table_name: users
    old:
      name: status
      type: text
      nullable: true
      default: "'pending'"
    new:
      name: status
      type: text
      nullable: true
      default: "'active'"
    cast_expr:
expect_sql: |
  CREATE TABLE "users" ("status" text DEFAULT 'pending')
  PRAGMA defer_foreign_keys = ON
  CREATE TABLE "__gaman_rebuild_users" ("status" text DEFAULT 'active')
  INSERT INTO "__gaman_rebuild_users" ("status") SELECT "status" FROM "users"
  DROP TABLE "users"
  ALTER TABLE "__gaman_rebuild_users" RENAME TO "users"
  DROP TABLE IF EXISTS temp."__gaman_fk_check_users"
  CREATE TEMP TABLE "__gaman_fk_check_users" ("violation" integer CHECK ("violation" = 0))
  INSERT INTO temp."__gaman_fk_check_users" ("violation") SELECT 1 FROM pragma_foreign_key_check
  DROP TABLE temp."__gaman_fk_check_users"
  PRAGMA foreign_key_check
