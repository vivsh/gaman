---
description: SQLite rebuild omits generated columns from copied insert columns.
group: sql_rendering
features:
- group.sql_rendering
- kind.migration_to_sql
- renderer.sqlite.add_column
- renderer.sqlite.create_table
- sql_rendering.sql_sqlite_rebuild_generated_column
kind: migration_to_sql
dialect: sqlite
migrations:
- id: 0001_create_users
  operations:
  - type: create_table
    table:
      name: users
      columns:
      - name: email
        type: text
        nullable: true
- id: 0002_add_generated
  dependencies:
  - 0001_create_users
  operations:
  - type: add_column
    table_name: users
    column:
      name: email_lower
      type: text
      nullable: true
      generated: lower(email)
expect_sql: |
  CREATE TABLE "users" ("email" text)
  PRAGMA defer_foreign_keys = ON
  CREATE TABLE "__gaman_rebuild_users" ("email" text, "email_lower" text GENERATED ALWAYS AS (lower(email)) STORED)
  INSERT INTO "__gaman_rebuild_users" ("email") SELECT "email" FROM "users"
  DROP TABLE "users"
  ALTER TABLE "__gaman_rebuild_users" RENAME TO "users"
  DROP TABLE IF EXISTS temp."__gaman_fk_check_users"
  CREATE TEMP TABLE "__gaman_fk_check_users" ("violation" integer CHECK ("violation" = 0))
  INSERT INTO temp."__gaman_fk_check_users" ("violation") SELECT 1 FROM pragma_foreign_key_check
  DROP TABLE temp."__gaman_fk_check_users"
  PRAGMA foreign_key_check
