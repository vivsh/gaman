---
description: SQLite renders simple nullable column additions with native ALTER TABLE.
group: sql_rendering
features:
- group.sql_rendering
- kind.migration_to_sql
- renderer.sqlite.add_column
- renderer.sqlite.create_table
- sql_rendering.sql_sqlite_add_nullable_column
kind: migration_to_sql
dialect: sqlite
migrations:
- id: 0001_create_users
  operations:
  - type: create_table
    table:
      name: users
      columns:
      - name: id
        type: integer
        primary_key: true
- id: 0002_add_email
  dependencies:
  - 0001_create_users
  operations:
  - type: add_column
    table_name: users
    column:
      name: email
      type: text
      nullable: true
expect_sql: |
  CREATE TABLE "users" ("id" integer PRIMARY KEY)
  ALTER TABLE "users" ADD COLUMN "email" text
