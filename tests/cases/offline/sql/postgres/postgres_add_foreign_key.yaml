---
description: PostgreSQL renders ALTER TABLE ADD CONSTRAINT for added foreign keys.
group: sql_rendering
features:
- group.sql_rendering
- kind.migration_to_sql
- operation.add_foreign_key
- renderer.postgres.add_foreign_key
- renderer.postgres.create_table
- sql_rendering.sql_postgres_add_foreign_key
kind: migration_to_sql
dialect: postgres
migrations:
- id: 0001_create_tables
  operations:
  - type: create_table
    table:
      name: users
      columns:
      - name: id
        type: integer
        primary_key: true
  - type: create_table
    table:
      name: posts
      columns:
      - name: id
        type: integer
        primary_key: true
      - name: user_id
        type: integer
- id: 0002_add_fk
  dependencies:
  - 0001_create_tables
  operations:
  - type: add_foreign_key
    table_name: posts
    foreign_key:
      name: posts_user_id_fkey
      columns:
      - user_id
      to_table: users
      to_columns:
      - id
expect_sql: |
  CREATE TABLE "users" ("id" integer NOT NULL, CONSTRAINT "users_pkey" PRIMARY KEY ("id"))
  CREATE TABLE "posts" ("id" integer NOT NULL, "user_id" integer NOT NULL, CONSTRAINT "posts_pkey" PRIMARY KEY ("id"))
  ALTER TABLE "posts" ADD CONSTRAINT "posts_user_id_fkey" FOREIGN KEY ("user_id") REFERENCES "users" ("id")
