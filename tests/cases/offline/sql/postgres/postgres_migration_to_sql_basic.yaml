---
description: Render SQL for a simple migration chain.
group: sql_rendering
features:
- group.sql_rendering
- kind.migration_to_sql
- renderer.postgres.add_column
- renderer.postgres.create_table
- sql_rendering.migration_to_sql_basic
kind: migration_to_sql
dialect: postgres
migrations:
- id: 0001_create_users
  operations:
  - type: create_table
    table:
      name: users
      columns:
      - name: id
        type: integer
        primary_key: true
      - name: username
        type: text
- id: 0002_add_email
  dependencies:
  - 0001_create_users
  operations:
  - type: add_column
    table_name: users
    column:
      name: email
      type: text
      nullable: true
expect_sql: |
  CREATE TABLE "users" ("id" integer NOT NULL, "username" text NOT NULL, CONSTRAINT "users_pkey" PRIMARY KEY ("id"))
  ALTER TABLE "users" ADD COLUMN "email" text
