---
description: Render SQL for richer PostgreSQL-only features.
group: sql_rendering
features:
- group.sql_rendering
- kind.migration_to_sql
- operation.create_enum
- operation.create_extension
- renderer.postgres.create_enum
- renderer.postgres.create_extension
- renderer.postgres.create_table
- renderer.postgres.create_view
- renderer.postgres.statement
- renderer.postgres.summary
- sql_rendering.migration_to_sql_postgres_features
kind: migration_to_sql
dialect: postgres
migrations:
- id: 0001_create_core
  operations:
  - type: create_extension
    extension:
      name: pgcrypto
  - type: create_enum
    enum_def:
      name: status
      values:
      - active
      - inactive
  - type: create_table
    table:
      name: users
      columns:
      - name: id
        type: integer
        primary_key: true
      - name: email
        type: text
      - name: slug
        type: text
        generated: lower(email)
      - name: status
        type: status
        default: "'active'"
      constraints:
      - kind: unique
        name: users_email_key
        columns:
        - email
      - kind: check
        name: users_email_check
        expression: email <> ''
      indexes:
      - name: users_active_email_idx
        columns:
        - email
        predicate: status = 'active'
  - type: create_view
    view:
      name: active_users
      definition: SELECT email FROM users WHERE status = 'active'
  - type: statement
    up: COMMENT ON TABLE users IS 'application users'
    down: COMMENT ON TABLE users IS NULL
expect_sql: |
  CREATE EXTENSION IF NOT EXISTS "pgcrypto"
  CREATE TYPE "status" AS ENUM ('active', 'inactive')
  CREATE TABLE "users" ("id" integer NOT NULL, "email" text NOT NULL, "slug" text GENERATED ALWAYS AS (lower(email)) STORED, "status" status NOT NULL DEFAULT 'active', CONSTRAINT "users_pkey" PRIMARY KEY ("id"), CONSTRAINT "users_email_key" UNIQUE ("email"), CONSTRAINT "users_email_check" CHECK (email <> ''))
  CREATE INDEX "users_active_email_idx" ON "users" ("email") WHERE status = 'active'
  CREATE OR REPLACE VIEW "active_users" AS SELECT email FROM users WHERE status = 'active'
  COMMENT ON TABLE users IS 'application users'
