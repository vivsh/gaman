description: MariaDB renders only supported foreign key actions.
group: sql_rendering
features: [foreign_key_actions, group.sql_rendering, kind.migration_to_sql]
kind: migration_to_sql
dialect: mariadb
migrations:
- id: 0001_mariadb_fk
  atomic: false
  operations:
  - type: create_table
    table:
      name: parents
      columns:
      - {name: id, type: INT, primary_key: true}
  - type: create_table
    table:
      name: children
      columns:
      - {name: parent_id, type: INT, nullable: true}
      foreign_keys:
      - name: children_parent_id_fkey
        columns: [parent_id]
        to_table: parents
        to_columns: [id]
        on_delete: set_null
        on_update: cascade
expect_sql: |
  CREATE TABLE `parents` (`id` INT NOT NULL, CONSTRAINT `parents_pkey` PRIMARY KEY (`id`))
  CREATE TABLE `children` (`parent_id` INT NULL, CONSTRAINT `children_parent_id_fkey` FOREIGN KEY (`parent_id`) REFERENCES `parents` (`id`) ON DELETE SET NULL ON UPDATE CASCADE)
