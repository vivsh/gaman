description: Parse a simple SQL table and index into schema state.
kind: sql_to_schema
dialect: postgres
sql: |
  CREATE TABLE users (
      id integer PRIMARY KEY,
      email text NOT NULL
  );

  CREATE UNIQUE INDEX users_email_idx ON users (email);
expect_schema:
  tables:
    users:
      name: users
      columns:
        - name: id
          type: integer
          primary_key: true
        - name: email
          type: text
      indexes:
        - name: users_email_idx
          columns: [email]
          unique: true
