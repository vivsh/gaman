---
description: SQLite declared type aliases canonicalize before diffing.
group: validation
features:
- group.validation
- kind.schema_to_migration
- validation.validation_sqlite_type_alias_noop
kind: schema_to_migration
dialect: sqlite
name: sqlite_canonical_type_noop
migrations:
- id: 0001_create_users
  operations:
  - type: create_table
    table:
      name: users
      columns:
      - name: id
        type: integer
        primary_key: true
      - name: email
        type: text
      - name: active
        type: integer
current:
  tables:
    users:
      name: users
      columns:
      - name: id
        type: int
        primary_key: true
      - name: email
        type: varchar
      - name: active
        type: boolean
expect_no_changes: true
