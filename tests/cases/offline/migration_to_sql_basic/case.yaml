description: Render SQL for a simple migration chain.
kind: migration_to_sql
dialect: postgres
migrations:
  - id: 0001_create_users
    operations:
      - type: create_table
        table:
          name: users
          columns:
            - name: id
              type: integer
              primary_key: true
            - name: username
              type: text
  - id: 0002_add_email
    dependencies: [0001_create_users]
    operations:
      - type: add_column
        table_name: users
        column:
          name: email
          type: text
          nullable: true
expect_sql: |
  CREATE TABLE "users" ("id" integer PRIMARY KEY, "username" text NOT NULL)
  ALTER TABLE "users" ADD COLUMN "email" text
