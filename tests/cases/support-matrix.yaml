  dialects:
    postgres:
      status: supported
      evidence:
        offline:
        - case: function_formatting_noop
          assertions:
          - schema_to_migration
          - operations
          - replayed_schema
          - sql
        - case: trigger_query_formatting_noop
          assertions:
          - schema_to_migration
          - operations
          - replayed_schema
          - sql
        - case: view_formatting_noop
          assertions:
          - schema_to_migration
          - operations
          - replayed_schema
          - sql
        online: []
    sqlite:
      status: planned
      evidence:
        offline: []
        online: []
      note: SQLite opaque-source formatting equivalence lacks accepted case-level
        evidence.
    mysql:
      status: planned
      note: MySQL opaque-object diffing is not implemented yet.
      evidence:
        online: []
        offline: []
    mariadb:
      status: planned
      note: MariaDB opaque-object diffing is not implemented yet.
      evidence:
        online: []
        offline: []
