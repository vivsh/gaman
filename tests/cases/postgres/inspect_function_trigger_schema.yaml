description: Inspect custom-schema functions and triggers with scoped function references.
kind: inspect
setup_sql: |
  CREATE TABLE users (
      id integer PRIMARY KEY
  );
  CREATE FUNCTION audit_users()
  RETURNS trigger
  LANGUAGE plpgsql
  AS $$BEGIN RETURN NEW; END$$;
  CREATE TRIGGER users_audit
  AFTER INSERT ON users
  FOR EACH ROW
  EXECUTE FUNCTION audit_users();
expect_schema:
  tables:
    users:
      name: users
      columns:
        - name: id
          type: integer
          primary_key: true
      triggers:
        - name: users_audit
          timing: after
          events: [insert]
          scope: row
          function_name: audit_users
  functions:
    audit_users:
      name: audit_users
      arguments: ""
      returns: trigger
      language: plpgsql
      body: BEGIN RETURN NEW; END
