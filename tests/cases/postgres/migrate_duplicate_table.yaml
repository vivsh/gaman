description: Migrating a table that already exists fails with a duplicate error.
kind: migrate
setup_sql: |
  CREATE TABLE "users" (id integer);
migrations:
  - id: 0001_create_users
    operations:
      - type: create_table
        table:
          name: users
          columns:
            - name: id
              type: integer
              primary_key: true
expect_error: "already exists"
