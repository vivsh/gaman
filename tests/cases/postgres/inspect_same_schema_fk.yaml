description: Inspect preserves same-schema foreign keys without drift after schema scoping.
kind: inspect
setup_sql: |
  CREATE TABLE accounts (
      id integer PRIMARY KEY
  );
  CREATE TABLE users (
      id integer PRIMARY KEY,
      account_id integer NOT NULL,
      CONSTRAINT users_account_id_fkey FOREIGN KEY (account_id) REFERENCES accounts (id)
  );
expect_schema:
  tables:
    accounts:
      name: accounts
      columns:
        - name: id
          type: integer
          primary_key: true
    users:
      name: users
      columns:
        - name: id
          type: integer
          primary_key: true
        - name: account_id
          type: integer
      foreign_keys:
        - name: users_account_id_fkey
          from_column: account_id
          to_table: accounts
          to_column: id
