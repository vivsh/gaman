description: Apply a simple migration chain and inspect the resulting live schema.
kind: migrate
migrations:
  - id: 0001_create_users
    operations:
      - type: create_table
        table:
          name: users
          columns:
            - name: id
              type: integer
              primary_key: true
            - name: username
              type: text
  - id: 0002_add_email
    dependencies: [0001_create_users]
    operations:
      - type: add_column
        table_name: users
        column:
          name: email
          type: text
          nullable: true
expect_schema:
  tables:
    users:
      name: users
      columns:
        - name: id
          type: integer
          primary_key: true
        - name: username
          type: text
        - name: email
          type: text
          nullable: true
