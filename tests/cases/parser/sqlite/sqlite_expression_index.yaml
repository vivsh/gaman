---
description: SQLite expression CREATE INDEX is preserved as an opaque index.
dialect: sqlite
sql: |
  CREATE TABLE users (email text);
  CREATE INDEX users_lower_email_idx ON users (lower(email)) WHERE email IS NOT NULL;
expect_entities:
- kind: index
  table: users
  name: users_lower_email_idx
expect_schema:
  tables:
    users:
      name: users
      columns:
      - name: email
        type: text
        nullable: true
      indexes:
      - name: users_lower_email_idx
        columns: []
        unique: false
        opaque:
          raw: |2-

            CREATE INDEX users_lower_email_idx ON users (lower(email)) WHERE email IS NOT NULL
          trusted: false
          fingerprint: v1:sha256:125f1be6aaaec01a177a696ae88b5e2dc9133a89105d56f05e3668e494b4807f
