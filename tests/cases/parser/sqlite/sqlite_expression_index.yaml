---
description: SQLite expression CREATE INDEX is preserved as an opaque index.
dialect: sqlite
sql: |
  CREATE TABLE users (email text);
  CREATE INDEX users_lower_email_idx ON users (lower(email)) WHERE email IS NOT NULL;
expect_entities:
- kind: index
  table: users
  name: users_lower_email_idx
expect_schema:
  tables:
    users:
      name: users
      columns:
      - name: email
        type: text
        nullable: true
      indexes:
      - name: users_lower_email_idx
        columns: []
        unique: false
        opaque:
          raw: CREATE INDEX users_lower_email_idx ON users(lower(email)) WHERE email IS NOT NULL
          trusted: false
          fingerprint: v1:sha256:eeb9abaac135f502b8af3eb42f05fa2f2853579590b139595a8882c404f9a619
