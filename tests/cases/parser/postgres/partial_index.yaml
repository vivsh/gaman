---
description: PostgreSQL partial CREATE INDEX preserves predicate metadata.
dialect: postgres
sql: |
  CREATE TABLE users (email text, active boolean);
  CREATE INDEX users_active_email_idx ON users (email) WHERE active = true;
expect_entities:
- kind: index
  table: users
  name: users_active_email_idx
expect_schema:
  tables:
    users:
      name: users
      columns:
      - name: email
        type: text
        nullable: true
      - name: active
        type: boolean
        nullable: true
      indexes:
      - name: users_active_email_idx
        columns: [email]
        unique: false
        predicate: active = true
