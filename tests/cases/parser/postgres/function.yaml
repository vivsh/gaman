---
description: PostgreSQL CREATE FUNCTION lowers into FunctionDef.
dialect: postgres
sql: |
  CREATE FUNCTION add_numbers(a integer, b integer) RETURNS integer
  LANGUAGE sql
  AS $$ SELECT a + b; $$;
expect_entities:
- kind: function
  name: "add_numbers(integer, integer)"
expect_schema:
  tables: {}
  functions:
    add_numbers(integer, integer):
      name: add_numbers
      parameters:
      - name: a
        type: integer
      - name: b
        type: integer
      returns: integer
      language: sql
      body: " SELECT a + b; "
