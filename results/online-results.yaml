features:
  check_constraints:
    mysql:
      status: unimplemented
      reason: dialect section missing
    postgres:
      status: success
      evidence:
      - case: drop_index_constraint_shared
        description: dropped indexes and constraints stop enforcing their old rules
        checks:
        - migrate
        - data
      - case: indexes_constraints_shared
        description: indexes unique constraints and check constraints enforce live data rules
        checks:
        - migrate
        - data
      - case: verify_detects_missing_index_constraint_fk
        description: verify reports missing owned indexes constraints and foreign keys
        checks:
        - verify
    sqlite:
      status: success
