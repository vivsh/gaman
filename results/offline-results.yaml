features:
  answer.keep_type:
    status: success
    evidence:
    - case: unknown_type_keep_type_action
      description: KeepType preserves an explicitly approved custom type in the generated migration.
      group: clarifier
      kind: schema_to_migration
      dialect: postgres
  answer.not_null_default:
    status: success
    evidence:
    - case: not_null_add_default_action
      description: NotNullDefault records a default for a newly added non-null column.
      group: clarifier
      kind: schema_to_migration
      dialect: postgres
    - case: not_null_change_default_action
      description: NotNullDefault for a nullability change emits a backfill statement before altering the column.
      group: clarifier
      kind: schema_to_migration
      dialect: postgres
  answer.not_null_manual:
    status: success
    evidence:
    - case: not_null_change_manual_action
      description: NotNullManual for a nullability change acknowledges the risk and leaves the alter unchanged.
      group: clarifier
      kind: schema_to_migration
      dialect: postgres
    - case: not_null_manual_action
      description: NotNullManual acknowledges the risk and leaves the non-null add unchanged for manual handling.
      group: clarifier
      kind: schema_to_migration
      dialect: postgres
  answer.not_null_nullable:
    status: success
    evidence:
    - case: not_null_add_nullable_action
      description: NotNullNullable keeps a newly added column nullable.
      group: clarifier
      kind: schema_to_migration
      dialect: postgres
    - case: not_null_change_nullable_action
      description: NotNullNullable for a nullability change keeps the target column nullable.
      group: clarifier
      kind: schema_to_migration
      dialect: postgres
  answer.rename_no:
    status: success
    evidence:
    - case: rename_enum_value_no_action
      description: RenameNo for an enum value leaves enum replacement operations unchanged.
      group: clarifier
      kind: schema_to_migration
      dialect: postgres
    - case: rename_no_action
      description: RenameNo keeps a column drop/add pair instead of rewriting it to a rename.
      group: clarifier
      kind: schema_to_migration
      dialect: postgres
    - case: rename_table_no_action
      description: RenameNo for a table leaves drop/create operations unchanged.
      group: clarifier
      kind: schema_to_migration
      dialect: postgres
  answer.rename_to:
    status: success
    evidence:
    - case: rename_enum_value_action
      description: RenameTo rewrites an enum label replacement into a rename-enum-value operation.
      group: clarifier
      kind: schema_to_migration
      dialect: postgres
    - case: rename_column_with_decision
      description: A rename-column decision rewrites drop/add into a rename operation.
      group: diff
      kind: schema_to_migration
      dialect: postgres
    - case: rename_table_with_decision
      description: A rename-table decision rewrites drop/create into a rename operation.
      group: diff
      kind: schema_to_migration
      dialect: postgres
  answer.type_cast:
    status: success
    evidence:
    - case: alter_type_with_cast_decision
      description: A type-cast decision records explicit cast SQL for an altered column type.
      group: diff
      kind: schema_to_migration
      dialect: postgres
  answer.type_cast_implicit:
    status: success
    evidence:
    - case: type_cast_implicit_action
      description: TypeCastImplicit allows a type change without an explicit cast expression.
      group: clarifier
      kind: schema_to_migration
      dialect: postgres
  answer.use_type:
    status: success
    evidence:
    - case: unknown_type_use_type_action
      description: UseType rewrites an unknown type to a suggested canonical type before diffing.
      group: clarifier
      kind: schema_to_migration
      dialect: postgres
