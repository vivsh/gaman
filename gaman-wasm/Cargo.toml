[package]
name = "gaman-wasm"
version = "0.3.29"
edition = "2024"
description = "Browser bindings for the Gaman migration engine"
license = "MIT"
repository = "https://github.com/vivsh/gaman"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gaman-core = { path = "../gaman-core", version = "0.3.29", features = ["command-args"] }
js-sys = "0.3"
send_wrapper = "0.6"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
