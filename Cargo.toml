[workspace]
members = [".", "gaman-core"]
resolver = "2"

[package]
name = "gaman"
version = "0.3.20"
edition = "2024"
description = "Offline-first schema migration engine for SQLx-backed databases"
license = "MIT"
repository = "https://github.com/vivsh/gaman"
homepage = "https://github.com/vivsh/gaman"
readme = "README.md"
keywords = ["migrations", "postgresql", "sqlite", "schema", "cli"]
categories = ["database", "command-line-utilities"]
exclude = [".env", "output.txt", "tests/", ".github/"]

[[bin]]
name = "gaman"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "gaman-support-matrix"
path = "src/bin/gaman-support-matrix.rs"
required-features = ["native"]

[[test]]
name = "offline"
path = "tests/offline.rs"
harness = false
required-features = ["native"]

[[test]]
name = "offline_coverage"
path = "tests/offline_coverage.rs"
required-features = ["native"]

[[test]]
name = "parser"
path = "tests/parser.rs"
harness = false
required-features = ["native"]

[[test]]
name = "online"
path = "tests/online.rs"
harness = false
required-features = ["db"]

[[test]]
name = "sqlite_dialect"
path = "tests/sqlite_dialect.rs"
required-features = ["sqlite"]

[[test]]
name = "yaml_adapter"
path = "tests/yaml_adapter.rs"
required-features = ["native"]

[features]
default = ["native", "cli", "all-supported-dialects"]
all-supported-dialects = ["postgres", "sqlite"]
offline = ["dep:gaman-core"]
offline-sqlite = ["offline"]
native = ["dep:gaman-core", "dep:serde", "dep:serde_yaml", "dep:thiserror"]
fs = ["native"]
db = ["native", "dep:sqlx", "dep:tokio"]
cli = ["fs", "db", "dep:argh", "dep:dotenvy"]
postgres = ["db", "sqlx/postgres"]
sqlite = ["db", "sqlx/sqlite"]
mysql = ["db", "sqlx/mysql"]

[dependencies]
argh = { version = "0.1.19", optional = true }
dotenvy = { version = "0.15.7", optional = true }
gaman-core = { version = "0.3.20", path = "gaman-core", optional = true, default-features = false }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-native-tls", "derive"], optional = true }
tokio = { version = "1", features = ["rt", "macros"], optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_yaml = { version = "0.9.34", optional = true }
thiserror = { version = "2.0.18", optional = true }

[dev-dependencies]
tempfile = "3"
