[workspace]
members = [".", "gaman-macros"]
resolver = "2"

[package]
name = "gaman"
version = "0.3.17"
edition = "2024"
description = "PostgreSQL-first, offline schema migration tool with Django-like ergonomics"
license = "MIT"
repository = "https://github.com/vivsh/gaman"
homepage = "https://github.com/vivsh/gaman"
readme = "README.md"
keywords = ["migrations", "postgresql", "database", "schema", "cli"]
categories = ["database", "command-line-utilities"]
exclude = [".env", "output.txt", "tests/", ".github/"]

[features]
default = ["postgres"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]

[dependencies]
argh = "0.1.19"
dotenvy = "0.15.7"
gaman-macros = { version = "0.3.17", path = "gaman-macros" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-native-tls"] }
tokio = { version = "1", features = ["rt", "macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sqlparser = "0.61.0"
thiserror = "2.0.18"

[dev-dependencies]
proptest = "1"
tempfile = "3"
