[workspace]
members = [".", "gaman-core", "gaman-wasm"]
resolver = "2"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[package]
name = "gaman"
version = "0.3.31"
edition = "2024"
default-run = "gaman"
description = "Schema-first SQL migration CLI for PostgreSQL, SQLite, and MySQL with offline planning, Django-style prompts, drift verification, and repair"
license = "MIT"
repository = "https://github.com/vivsh/gaman"
homepage = "https://github.com/vivsh/gaman"
documentation = "https://docs.rs/gaman"
readme = "README.md"
keywords = ["database", "migration", "schema", "sql", "cli"]
categories = ["database", "command-line-utilities"]
exclude = [".env", "output.txt", "tests/", ".github/"]

[[bin]]
name = "gaman"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "gaman-support-matrix"
path = "src/bin/gaman-support-matrix.rs"
required-features = ["native"]

[[bin]]
name = "gaman-evidence-doc"
path = "src/bin/gaman-evidence-doc.rs"
required-features = ["native"]

[[test]]
name = "offline"
path = "tests/offline.rs"
harness = false
required-features = ["native"]

[[test]]
name = "offline_coverage"
path = "tests/offline_coverage.rs"
required-features = ["native"]

[[test]]
name = "parser"
path = "tests/parser.rs"
harness = false
required-features = ["native"]

[[test]]
name = "online"
path = "tests/online.rs"
harness = false
required-features = ["db"]

[[test]]
name = "sqlite_dialect"
path = "tests/sqlite_dialect.rs"
required-features = ["sqlite"]

[[test]]
name = "directory_migration_store"
path = "tests/directory_migration_store.rs"
required-features = ["native"]

[features]
default = ["native", "cli", "all-supported-dialects"]
all-supported-dialects = ["postgres", "sqlite"]
offline = ["dep:gaman-core"]
offline-sqlite = ["offline"]
native = ["dep:gaman-core", "dep:serde", "dep:serde_yaml", "dep:thiserror"]
chrono-types = ["native", "gaman-core/chrono-types"]
fs = ["native", "dep:tempfile"]
db = ["native", "dep:sqlx", "dep:tokio"]
json-types = ["native", "gaman-core/json-types"]
cli = ["fs", "db", "dep:argh", "dep:dotenvy", "gaman-core/command-args"]
postgres = ["db", "sqlx/postgres"]
sqlite = ["db", "sqlx/sqlite"]
mysql = ["db", "sqlx/mysql"]
mariadb = ["db", "sqlx/mysql"]
time-types = ["native", "gaman-core/time-types"]
uuid-types = ["native", "gaman-core/uuid-types"]

[dependencies]
argh = { version = "0.1.19", optional = true }
dotenvy = { version = "0.15.7", optional = true }
gaman-core = { version = "0.3.31", path = "gaman-core", optional = true, default-features = false }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-native-tls", "derive"], optional = true }
tokio = { version = "1", features = ["rt", "macros", "fs", "io-util"], optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_yaml = { version = "0.9.34", optional = true }
thiserror = { version = "2.0.18", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
